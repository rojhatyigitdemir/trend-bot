name: Test AltData Verifier

on:
  workflow_dispatch: # Bu ayar sayesinde kod kendi kendine değil, sadece sen butona basınca çalışır.

jobs:
  test-altdata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Run AltData Verifier
        run: python -u altdata_verifier.py
